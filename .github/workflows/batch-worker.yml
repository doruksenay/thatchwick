# Toplu işçi: PixelLab'i Claude olmadan çalıştırır (tools/art/batch_worker.py, 2026-11-18 pilotu).
# Yalnızca elle tetiklenir: Actions > Batch worker > Run workflow, "jobs" alanına iş numaraları (ör. "345 342").
# Yalnızca `worker: batch` ve `approved_by: user` olan işleri yapar. Claude token'ı harcamaz.
# Push, tools/art/cloud_guard.py denetiminden sonra yapılır (art-worker ile aynı kural).
name: Batch worker

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "İş numaraları, boşlukla (ör. 345 342 343)"
        required: true

permissions:
  contents: write

concurrency:
  group: batch-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Araçlar
        run: |
          pip install --quiet "pillow==12.3.0"
          git config user.name "thatchwick-batch-worker"
          git config user.email "batch-worker@users.noreply.github.com"
          git lfs pull

      - name: Üret
        env:
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
          JOBS: ${{ inputs.jobs }}
        run: |
          # Girdi yalnızca iş numarası olabilir (komut enjeksiyonu yok)
          for j in $JOBS; do [[ "$j" =~ ^[0-9]{3}[a-z]?$ ]] || { echo "::error::geçersiz iş: $j"; exit 1; }; done
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python tools/art/batch_worker.py run $JOBS

      - name: Denetle ve push et
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add art Assets/Art/Iso
          git diff --cached --quiet && { echo "Değişiklik yok."; exit 0; }
          git commit -q -m "art(${{ inputs.jobs }}): toplu işçi (Claude'suz)"
          set +e
          guard_out=$(python tools/art/cloud_guard.py "$BASE" HEAD)
          code=$?
          set -e
          target=$(printf '%s\n' "$guard_out" | tail -1)
          if [ "$code" != "0" ] || [ "$target" != "main" ]; then
            echo "::error::Denetim main'e izin vermedi (kod $code, '$target'); push yok."; exit 1
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase "$remote" main || { git rebase --abort || true; echo "::error::main ile çakışma"; exit 1; }
            if git push "$remote" HEAD:main; then exit 0; fi
            sleep $(( RANDOM % 20 + 5 ))
          done
          echo "::error::push 5 denemede başarısız"; exit 1
