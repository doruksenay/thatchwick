name: Core tests

# Unity'siz saf C# mantık testleri. Her push ve PR'da çalışır; ücretsizdir ve hızlıdır.
on:
  push:
    branches: [main]
    # İşçilerin yalnızca görsel/ses ve kuyruk dosyası içeren push'ları testleri etkilemez; boşuna çalışmasın
    # (haftada ~340 çalışmanın çoğu buydu). PR'da süzgeç yok: "test" denetimi her PR'da görünmeli.
    paths-ignore:
      - 'art/**'
      - 'audio/**'
      - 'Assets/Art/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test core/Thatchwick.Core.Tests --verbosity normal

      # Game katmanı (GameRoot, BuildMode, paneller) sahte Unity tipleriyle derlenir:
      # Core'daki bir değişiklik Unity tarafını kırarsa Unity açılmadan burada yakalanır.
      - name: Game katmanı derleme denetimi
        run: dotnet build core/Thatchwick.GameCheck --verbosity minimal

      # Karakter katman araçları (tools/art/ramps.py, manken.py): rampa formülü C# ile aynı mı, bölge
      # haritası ve çapalar doğru mu. Görsel dosyası gerektirmez (LFS'siz checkout yeter).
      - name: Sanat araçları testleri
        run: |
          python3 -m pip install --quiet pillow
          python3 -m unittest discover tools/art/tests
