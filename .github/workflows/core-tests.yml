name: Core tests

# Unity'siz saf C# mantık testleri. Her push ve PR'da çalışır; ücretsizdir ve hızlıdır.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test core/Thatchwick.Core.Tests --verbosity normal

      # Game katmanı (GameRoot, BuildMode, paneller) sahte Unity tipleriyle derlenir:
      # Core'daki bir değişiklik Unity tarafını kırarsa Unity açılmadan burada yakalanır.
      - name: Game katmanı derleme denetimi
        run: dotnet build core/Thatchwick.GameCheck --verbosity minimal
