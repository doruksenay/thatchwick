name: Unity tests

# Unity Test Framework (EditMode + PlayMode). Unity lisansı gerektirir: lisans secret'ları yoksa iş atlanır
# (hata vermez). Secret'lar eklendiği anda Unity tarafına dokunan her PR'da kendiliğinden çalışır.
# Kurulum: repo Secrets'a UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD eklenir
# (GameCI belgesindeki güncel yönteme göre; bkz. docs/unity-baglanti.md ve docs/yayin-altyapisi.md).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/Scripts/**'
      - 'Assets/Tests/**'
      - 'Assets/Resources/**'
      - 'Assets/Scenes/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  check-project:
    runs-on: ubuntu-latest
    outputs:
      has_unity: ${{ steps.detect.outputs.has_unity }}
      has_license: ${{ steps.detect.outputs.has_license }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: detect
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          echo "has_license=$HAS_LICENSE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_LICENSE" != "true" ]; then echo "::notice::UNITY_LICENSE secret'ı yok; Unity testleri atlandı."; fi
          if [ -f ProjectSettings/ProjectVersion.txt ]; then
            echo "has_unity=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_unity=false" >> "$GITHUB_OUTPUT"
            echo "Unity projesi henüz repoda yok; atlandı."
          fi

  test:
    needs: check-project
    if: needs.check-project.outputs.has_unity == 'true' && needs.check-project.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: artifacts
