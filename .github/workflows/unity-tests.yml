name: Unity tests

# Unity Test Framework (EditMode + PlayMode). Unity lisansı gerektirdiği için
# yalnızca elle tetiklenir ve Unity projesi (ProjectSettings) repoda yoksa atlanır.
# Kurulum: repo Secrets'a UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD eklenir
# (GameCI belgesindeki güncel yönteme göre; bkz. docs/unity-baglanti.md).
on:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest
    outputs:
      has_unity: ${{ steps.detect.outputs.has_unity }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f ProjectSettings/ProjectVersion.txt ]; then
            echo "has_unity=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_unity=false" >> "$GITHUB_OUTPUT"
            echo "Unity projesi henüz repoda yok; atlandı."
          fi

  test:
    needs: check-project
    if: needs.check-project.outputs.has_unity == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: artifacts
