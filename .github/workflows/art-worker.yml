name: Art worker

# Asset kuyruğunu bulutta işler: art/queue'ya onaylı iş geldiğinde pixellab-artist ajanını çalıştırır.
# Kurallar art/budget.md ile aynıdır (işçi ajan ve tools/art/queue_ready.py okur); bu dosya kural koymaz.
# Gerekli repo secret'ları (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  bilgisayarında `claude setup-token` ile üretilir (Claude aboneliğini kullanır)
#   PIXELLAB_API_TOKEN       pixellab.ai hesabındaki API token'ı
# İkisi yoksa iş sessizce atlanır. Ayrıntı: art/README.md "Otomatik işçiler".
#
# Güvenlik düzeni (art/README.md "Bulut işçisinin güvenliği"):
#   - Çalıştırma başına bir iş. İşi iş akışı sahiplenir (status: running) ve push eder; ajan yalnızca commit eder.
#   - Checkout kimlik bilgisi bırakmaz: ajan push edemez. Push, tools/art/cloud_guard.py denetiminden sonra yapılır
#     (yalnızca işçi yolları, var olan PNG'nin üzerine yazmak yok, .meta yok, sır değeri yok).
#   - tools/art değiştiyse sonuç main'e değil art-worker/<çalıştırma> dalına gider ve PR açılır.
#   - Eylemler commit SHA'sıyla, araçlar sürümle sabitlenir.

on:
  push:
    branches: [main]
    paths:
      - "art/queue/**"
      - "art/budget.md"
      - "art/style/**"
  schedule:
    - cron: "17 */3 * * *"      # günlük tavan sıfırlanınca ve kabul sonrası takılı kalan işler için
  # Tur sonunda iş kaldıysa "Sonraki tur" adımı workflow_dispatch ile zinciri sürdürür.
  workflow_dispatch:

concurrency:
  group: art-worker
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # zincir: iş kaldıysa bir sonraki turu kendisi başlatır
  pull-requests: write  # tools/art değiştiyse sonuç PR olarak açılır
  issues: write         # her iş bitince "art-bildirim" konusuna yorum (tools/art/notify.py)

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Paralel üretim (art/budget.md "Paralel üretim"; kullanıcı kararı 2026-11-18, 2026-11-21'de Pixel Architect ile
    # en yükseğe çıktı): her tur 6 şeritte 6 işi aynı anda yürütür (kullanıcı kararı 2026-11-21: 10'dan 6'ya, Claude kullanım
    # sınırı için). PixelLab aynı anda 20 işe izin verir; şerit başına en çok 3 eşzamanlı çağrı (art/budget.md). Her şerit sıradaki uygun işi sahiplenir; çakışan sahiplenmede push reddedilir, şerit geri alıp sonrakini dener.
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1, 2, 3, 4, 5]
    env:
      LANE: ${{ matrix.lane }}
    steps:
      # LFS dosyaları ancak iş varsa çekilir; kimlik bilgisi .git/config'e yazılmaz (ajan push edemez).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Uygun iş var mı
        id: ready
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_PIXELLAB: ${{ secrets.PIXELLAB_API_TOKEN != '' }}
        run: |
          set +e
          python tools/art/queue_ready.py --all --worker bulut
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "Uygun iş yok."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_CLAUDE" != "true" ] || [ "$HAS_PIXELLAB" != "true" ]; then
            echo "::notice::Uygun iş var ama CLAUDE_CODE_OAUTH_TOKEN ya da PIXELLAB_API_TOKEN secret'ı tanımlı değil; atlandı."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: İşi sahiplen
        id: claim
        if: steps.ready.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "thatchwick-art-worker"
          git config user.email "art-worker@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          sleep $(( LANE * 6 ))                          # şeritler aynı anda sahiplenmeye kalkmasın
          claimed=""
          for attempt in 1 2 3 4 5; do
            git pull --ff-only --quiet "$remote" main    # tetikten sonra main ilerlediyse en uca gel
            if ! out=$(python tools/art/queue_ready.py --claim --worker bulut); then
              echo "Uygun iş kalmadı."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            read -r job file <<< "$out"
            git add "$file"
            git commit -q -m "art($job): başladı (bulut, şerit $LANE)"
            # Başka şerit ya da yerel işçi araya girdiyse push reddedilir: sahiplenmeyi geri al, güncel main'le yeniden dene.
            if git push "$remote" HEAD:main; then claimed="$job"; break; fi
            echo "::notice::$job sahiplenmesi çakıştı (deneme $attempt); yeniden deneniyor."
            git reset --hard -q HEAD~1
            sleep $(( RANDOM % 15 + 5 ))
          done
          if [ -z "$claimed" ]; then
            echo "::notice::Şerit $LANE iş sahiplenemedi; atlandı."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: LFS dosyaları
        if: steps.claim.outputs.run == 'true'
        run: git lfs pull

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.claim.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Claude Code ve PixelLab MCP
        if: steps.claim.outputs.run == 'true'
        env:
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
        run: |
          pip install --quiet "pillow==12.3.0" "uv==0.13.9"   # iş dosyaları doğrulamayı `uv run --with pillow python ...` ile ister
          npm install -g "@anthropic-ai/claude-code@2.1.326"
          python - <<'PY'
          import json, os
          cfg = {"mcpServers": {"pixellab": {
              "type": "http",
              "url": "https://api.pixellab.ai/mcp",
              "headers": {"Authorization": "Bearer " + os.environ["PIXELLAB_API_TOKEN"]}}}}
          path = os.path.join(os.environ["RUNNER_TEMP"], "mcp.json")
          with open(path, "w") as f:
              json.dump(cfg, f)
          os.chmod(path, 0o600)
          PY

      # Ajan yalnızca sahiplenilen işi yapar ve commit eder; pull/push/lock adımları bulut modunda yoktur
      # (.claude/agents/pixellab-artist.md "Bulut modu"). git yalnızca okuma ve commit alt komutlarıyla açıktır.
      - name: pixellab-artist
        id: agent
        if: steps.claim.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ART_WORKER_MODE: cloud
          ART_JOB: ${{ steps.claim.outputs.job }}
        run: |
          # Claude kullanım sınırı (kullanıcı kararı 2026-11-21): oturum sınıra takılırsa adım başarısız sayılmaz;
          # aşağıdaki "Claude sınırı" adımı işi hemen sıraya geri koyar.
          log="$RUNNER_TEMP/agent.log"
          set +e
          claude -p "Bulut modundasin (serit $LANE): yalnizca art/queue icindeki $ART_JOB numarali isi (zaten sahiplenildi) art/budget.md kurallariyla isle, commit et, push etme ve ozet rapor ver." \
            --agent pixellab-artist \
            --max-turns 80 \
            --mcp-config "$RUNNER_TEMP/mcp.json" \
            --allowedTools "mcp__pixellab" "Read" "Write" "Edit" "Glob" "Grep" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git add:*)" "Bash(git commit:*)" \
              "Bash(python:*)" "Bash(python3:*)" "Bash(uv run:*)" "Bash(mkdir -p:*)" "Bash(cp -n:*)" "Bash(ls:*)" \
            2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          # Yalnızca çıkış kodu sıfır değilse ve sınır iletisi çıktının sonundaysa (ajanın metnindeki "rate limit"
          # sözü yanlış alarm vermesin).
          if [ "$code" != "0" ] && tail -n 8 "$log" | grep -qiE "usage limit|limit reached|hit your limit|reached your limit|out of (extra )?usage|resets [0-9]"; then
            echo "::warning::Claude kullanım sınırı; iş $ART_JOB sıraya geri konacak."
            echo "limit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Claude sınırı, işi sıraya geri koy
        if: always() && steps.agent.outputs.limit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.claim.outputs.base }}
          JOB: ${{ steps.claim.outputs.job }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git reset --hard -q "$BASE"                      # yarım kalan ajan commit'leri atılır
            git pull --ff-only -q "$remote" main
            file=$(ls art/queue/"$JOB"-*.md | head -1)
            sed -i '0,/^status: running/s//status: pending/' "$file"
            printf -- '---\nzaman: %s\niş: %s\n---\nBulut işçisi Claude kullanım sınırına takıldı. Bu andan sonra %s dakika yeni iş alınmaz (tools/art/queue_ready.py).\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$JOB" 60 > art/claude-sinir.md
            git add "$file" art/claude-sinir.md
            git commit -q -m "art($JOB): Claude sınırı, sıraya geri kondu"
            if git push "$remote" HEAD:main; then exit 0; fi
            sleep $(( RANDOM % 15 + 5 ))
          done
          echo "::error::$JOB sıraya geri konamadı; 6 saat sonra takılı sahiplenme olarak yeniden alınır."
          exit 1

      - name: Denetle ve push et
        id: push
        if: always() && steps.claim.outputs.run == 'true' && steps.agent.outputs.limit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIXELLAB_API_TOKEN: ${{ secrets.PIXELLAB_API_TOKEN }}
          GUARD_SECRET_VARS: CLAUDE_CODE_OAUTH_TOKEN,PIXELLAB_API_TOKEN,GH_TOKEN
          BASE: ${{ steps.claim.outputs.base }}
          JOB: ${{ steps.claim.outputs.job }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$(git status --porcelain -- art Assets/Art/Iso tools/art)" ]; then
            echo "::warning::Ajan commit edilmemiş değişiklik bıraktı; push edilmedi."
          fi
          # Çıkış kodu boruya kaybolmasın (eskiden `| tail -1` yüzünden "değişiklik yok" ve "reddedildi" de PR dalına gidiyordu).
          set +e
          guard_out=$(python tools/art/cloud_guard.py "$BASE" HEAD)
          code=$?
          set -e
          target=$(printf '%s\n' "$guard_out" | tail -1)
          if [ "$code" = "1" ]; then echo "Push edilecek bir şey yok."; exit 0; fi
          if [ "$code" != "0" ]; then
            echo "::error::Denetim reddetti; hiçbir şey push edilmedi. İş $JOB 'running' kalır, 6 saat sonra yeniden alınabilir."
            exit 1
          fi
          if [ "$target" = "main" ]; then
            # Paralel şeritler aynı anda push edebilir: reddedilirse yeniden çek ve dene. İçerik çakışması olursa zorlama yok.
            pushed=""
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase "$remote" main; then
                git rebase --abort || true
                echo "::error::$JOB sonucu main ile çakıştı; push edilmedi."; exit 1
              fi
              python tools/art/cloud_guard.py "$(git merge-base HEAD FETCH_HEAD)" HEAD > /dev/null
              if git push "$remote" HEAD:main; then pushed=1; break; fi
              sleep $(( RANDOM % 20 + 5 ))
            done
            [ -n "$pushed" ] || { echo "::error::$JOB push 5 denemede başarısız."; exit 1; }
          elif [ "$target" = "pr" ]; then
            branch="art-worker/${GITHUB_RUN_ID}-${LANE}"   # şeritler aynı dal adına yazmasın
            git push "$remote" "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" \
              --title "art($JOB): tools/art değişikliği içeren işçi sonucu" \
              --body "Bulut işçisi tools/art altında da değişiklik yaptı; yerel yoklayıcı bu betikleri çalıştırdığı için sonuç doğrudan main'e gitmedi. İnceleyip birleştir." \
              || echo "::warning::PR açılamadı (Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' kapalı olabilir). Sonuç $branch dalında; elle PR aç."
          else
            echo "::error::Denetimden beklenmeyen çıktı: '$target'; hiçbir şey push edilmedi."; exit 1
          fi

      # Kullanıcı kararı 2026-11-21: her iş bitince kullanıcı bilgilendirilir (konu yorumu, depo sahibi anılır).
      - name: Bildirim
        if: always() && steps.claim.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.claim.outputs.job }}
          PUSH_OUTCOME: ${{ steps.agent.outputs.limit == 'true' && 'claude-limit' || steps.push.outcome }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: |
          git pull --rebase -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
          python tools/art/notify.py "$JOB" "$PUSH_OUTCOME" || echo "::warning::Bildirim gönderilemedi."

      - name: Özet
        if: always() && steps.claim.outputs.run == 'true'
        run: |
          python tools/art/queue_ready.py --all --worker bulut || true
          git log --oneline -5

      # Zincir: bu tur en az bir işi bitirdiyse (review/failed/blocked commit'i) ve hâlâ uygun iş varsa
      # 3 saat beklemeden yeni tur başlatır. Frenler queue_ready.py ve art/budget.md'de; günlük tavan
      # dolunca uygun iş kalmaz ve zincir kendiliğinden durur. İlerleme yoksa (aynı iş takılı) zincirlemez.
      - name: Sonraki tur
        if: success() && steps.ready.outputs.run == 'true' && steps.agent.outputs.limit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          START_SHA: ${{ github.sha }}
        run: |
          git pull --rebase -q || true
          done=$(git log "$START_SHA"..HEAD --author=thatchwick-art-worker --format=%s | grep -vcE ': (başladı|Claude sınırı, sıraya geri kondu)$' || true)
          if [ "${done:-0}" -gt 0 ] && python tools/art/queue_ready.py --quiet --worker bulut; then
            echo "Bu turda $done iş bitti, uygun iş var: yeni tur başlatılıyor."
            gh workflow run art-worker.yml --ref main
          else
            echo "Zincir durdu (biten iş: ${done:-0}, uygun iş yok ya da ilerleme yok)."
          fi
